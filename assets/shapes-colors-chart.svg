  <text x="450" y="200" text-anchor="middle" font-size="26" font-weight="800" fill="#2E2A3D">Aakar (Shapes)</text><circle cx="90" cy="250" r="55" fill="#FF6F91"/><text x="90" y="345" text-anchor="middle" font-size="20" font-weight="700" fill="#2E2A3D">Circle (Gol)</text><rect x="240" y="200" width="100" height="100" fill="#4FC3F7"/><text x="290" y="345" text-anchor="middle" font-size="20" font-weight="700" fill="#2E2A3D">Square (Chaukor)</text><polygon points="490,190 550,300 430,300" fill="#FFB74D"/><text x="490" y="345" text-anchor="middle" font-size="20" font-weight="700" fill="#2E2A3D">Triangle (Tikon)</text><rect x="625" y="210" width="130" height="80" fill="#81C784"/><text x="690" y="345" text-anchor="middle" font-size="20" font-weight="700" fill="#2E2A3D">Rectangle (Aayat)</text><text x="450" y="440" text-anchor="middle" font-size="26" font-weight="800" fill="#2E2A3D">Rang (Colors)</text><circle cx="180" cy="500" r="45" fill="#FF6F91"/><text x="180" y="575" text-anchor="middle" font-size="20" font-weight="700" fill="#2E2A3D">Laal</text><circle cx="450" cy="500" r="45" fill="#FFD54F"/><text x="450" y="575" text-anchor="middle" font-size="20" font-weight="700" fill="#2E2A3D">Peela</text><circle cx="720" cy="500" r="45" fill="#4FC3F7"/><text x="720" y="575" text-anchor="middle" font-size="20" font-weight="700" fill="#2E2A3D">Neela</text><circle cx="180" cy="660" r="45" fill="#81C784"/><text x="180" y="735" text-anchor="middle" font-size="20" font-weight="700" fill="#2E2A3D">Hara</text><circle cx="450" cy="660" r="45" fill="#FFB74D"/><text x="450" y="735" text-anchor="middle" font-size="20" font-weight="700" fill="#2E2A3D">Narangi</text><circle cx="720" cy="660" r="45" fill="#BA68C8"/><text x="720" y="735" text-anchor="middle" font-size="20" font-weight="700" fill="#2E2A3D">Baingani</text>
